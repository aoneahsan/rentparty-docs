name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token, plus the id-token that deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a deploy in progress finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so each page's last-updated date is right
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enable Corepack (Yarn version from package.json)
        run: corepack enable
      - uses: actions/configure-pages@v6
      - run: yarn install --immutable
      - run: yarn build
        env:
          # Optional: an unset secret keeps its analytics provider off.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
